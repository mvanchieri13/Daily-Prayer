<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Hours">
<meta name="theme-color" content="#0f0e0b">
<title>Liturgy of the Hours</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f0e0b;--surface:#161410;--border:rgba(180,148,72,0.16);
  --gold:#c8a84a;--gold-dim:rgba(200,168,74,0.55);--gold-faint:rgba(200,168,74,0.09);
  --cream:#f0e8d5;--cream-dim:rgba(240,232,213,0.72);--cream-faint:rgba(240,232,213,0.38);
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--cream);font-family:'EB Garamond',Georgia,serif;font-size:17px;line-height:1.75;overflow:hidden}
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:var(--safe-top)}
.top-nav{background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.brand-row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
.brand-cross{color:var(--gold);letter-spacing:0.35em;font-size:0.85rem}
.brand-title{font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.18em;color:var(--gold);font-weight:400}
.brand-clock{margin-left:auto;font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.1em;color:var(--gold-dim)}
.lang-toggle{display:flex;gap:0;border:1px solid var(--border);border-radius:3px;overflow:hidden;flex-shrink:0}
.lang-btn{background:none;border:none;cursor:pointer;font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.14em;padding:3px 9px;color:var(--gold-dim);transition:all 0.15s}
.lang-btn.active{background:var(--gold-faint);color:var(--gold)}
.lang-btn:first-child{border-right:1px solid var(--border)}
.reset-btn{background:none;border:none;cursor:pointer;color:rgba(200,168,74,0.3);font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.12em;padding:3px 7px;transition:color 0.2s}
.reset-btn:hover{color:var(--gold-dim)}
.hour-scroll{display:flex;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:0 6px}
.hour-scroll::-webkit-scrollbar{display:none}
.hour-tab{flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:8px 13px 10px;background:none;border:none;cursor:pointer;position:relative;gap:1px;border-radius:4px 4px 0 0;transition:background 0.15s}
.hour-tab:hover{background:var(--gold-faint)}
.hour-tab.active{background:var(--gold-faint)}
.hour-tab.active::after{content:'';position:absolute;bottom:0;left:4px;right:4px;height:2px;background:var(--gold);border-radius:2px 2px 0 0}
.tab-latin{font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.14em;color:var(--gold-dim)}
.hour-tab.active .tab-latin{color:var(--gold)}
.tab-time{font-size:0.65rem;color:var(--cream-faint);font-style:italic}
.hour-tab.active .tab-time{color:var(--cream-dim)}
.tab-dot{width:4px;height:4px;border-radius:50%;background:var(--gold);margin-top:2px;box-shadow:0 0 4px var(--gold)}
.hour-tab .tab-check{display:none;font-size:0.5rem;color:rgba(200,168,74,0.5);margin-top:1px}
.hour-tab.visited .tab-check{display:block}
.main-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:var(--safe-bottom)}
.main-inner{padding:28px 20px 80px;max-width:580px;width:100%;margin:0 auto}
.hour-header{margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.hour-name-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.latin-name{font-family:'Cinzel',serif;font-size:1.7rem;color:var(--gold);font-weight:400;letter-spacing:0.08em}
.trans-name{font-style:italic;font-size:0.95rem;color:var(--cream-faint)}
.hour-desc{font-size:0.86rem;color:var(--cream-faint);font-style:italic;margin-bottom:8px}
.duration-badge{display:inline-block;font-family:'Cinzel',serif;font-size:0.58rem;letter-spacing:0.2em;color:rgba(200,168,74,0.45);border:1px solid var(--border);padding:2px 9px}
.section{margin-bottom:24px}
.section-label{font-family:'Cinzel',serif;font-size:0.58rem;letter-spacing:0.26em;color:var(--gold-dim);margin-bottom:9px;display:flex;align-items:center;gap:10px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.sign-of-cross{text-align:center;margin-bottom:14px}
.cross-symbol{font-size:1.3rem;color:var(--gold);letter-spacing:0.3em;opacity:0.75;display:block;margin-bottom:6px}
.cross-words{font-style:italic;font-size:0.88rem;color:var(--cream-faint);line-height:1.6}
.versicle-block{font-style:italic;color:var(--cream-dim)}
.versicle{display:grid;grid-template-columns:1.4em 1fr;gap:2px 8px;margin:3px 0}
.v-mark{color:var(--gold);font-style:normal}
.antiphon{font-style:italic;color:var(--gold-dim);font-size:0.93rem;padding:6px 14px;border-left:1px solid rgba(200,168,74,0.25);margin-bottom:10px}
.antiphon.bottom{margin-top:8px;margin-bottom:0}
.psalm-verses p{color:var(--cream-dim);margin-bottom:0.4em;font-size:0.98rem;white-space:pre-line}
.reading-ref{font-family:'Cinzel',serif;font-size:0.58rem;letter-spacing:0.16em;color:var(--gold-dim);margin-bottom:7px}
.reading-text{color:var(--cream-dim);font-size:0.97rem;line-height:1.8;border-left:1px solid var(--border);padding-left:14px;font-style:italic}
.psalm-ref-inline{font-style:italic;letter-spacing:0;color:var(--cream-faint);font-family:'EB Garamond',serif;font-size:0.95rem;font-weight:400}
.canticle-name{font-family:'Cinzel',serif;font-size:0.58rem;letter-spacing:0.16em;color:var(--gold-dim);margin-bottom:7px}
.canticle-text{color:var(--cream-dim);font-style:italic;font-size:0.97rem;line-height:1.85}
.canticle-text p{margin-bottom:0.45em;white-space:pre-line}
.silence-block{display:flex;flex-direction:column;align-items:center;padding:14px;border:1px solid var(--border);background:var(--gold-faint);margin-bottom:4px}
.silence-label{font-family:'Cinzel',serif;font-size:0.58rem;letter-spacing:0.22em;color:var(--gold-dim);margin-bottom:6px}
.silence-timer{font-family:'Cinzel',serif;font-size:1.4rem;color:var(--gold);letter-spacing:0.1em;min-width:2.5em;text-align:center}
.silence-btn{margin-top:8px;font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.18em;color:var(--gold-dim);background:none;border:1px solid var(--border);padding:4px 14px;cursor:pointer;transition:all 0.2s}
.silence-btn:hover{color:var(--gold);border-color:var(--gold)}
.intention-block{margin-bottom:4px}
.intention-input{width:100%;background:none;border:none;border-bottom:1px solid var(--border);color:var(--cream-dim);font-family:'EB Garamond',serif;font-size:0.97rem;font-style:italic;padding:6px 0;outline:none;line-height:1.5}
.intention-input::placeholder{color:var(--cream-faint)}
.intention-input:focus{border-bottom-color:var(--gold-dim)}
.examen-text{font-style:italic;color:var(--cream-faint);font-size:0.92rem;line-height:1.85}
.contrition-text{color:var(--cream-dim);font-style:italic;font-size:0.97rem;line-height:1.85}
.dismissal{margin-top:10px;font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.18em;color:var(--gold-dim);text-align:center;padding:12px;border:1px solid var(--border)}
.ornament{text-align:center;color:rgba(200,168,74,0.22);font-size:0.7rem;letter-spacing:0.5em;margin:20px 0}
.angelus-block{color:var(--cream-dim);font-size:0.97rem;line-height:1.85}
.angelus-verse{margin-bottom:0.5em;white-space:pre-line}
.angelus-response{font-style:italic;color:var(--gold-dim);margin-bottom:0.8em}
.angelus-ave{font-style:italic;color:var(--cream-dim);margin-bottom:0.8em;white-space:pre-line}
.salve-text{color:var(--cream-dim);font-style:italic;font-size:0.97rem;line-height:1.9;white-space:pre-line}
@media(min-width:700px){
  .shell{flex-direction:row}
  .top-nav{width:210px;flex-shrink:0;border-bottom:none;border-right:1px solid var(--border);display:flex;flex-direction:column;padding-top:24px;height:100vh;height:100dvh}
  .brand-row{flex-direction:column;align-items:flex-start;padding:0 20px 18px;gap:8px}
  .brand-clock{margin-left:0}
  .lang-toggle{align-self:flex-start}
  .hour-scroll{flex-direction:column;overflow-x:visible;overflow-y:auto;padding:10px 0;flex:1}
  .hour-tab{flex-direction:row;padding:9px 20px;border-radius:0;text-align:left;gap:10px;align-items:center}
  .hour-tab.active::after{top:0;bottom:0;left:0;right:auto;width:2px;height:auto;border-radius:0}
  .tab-time{margin-left:auto}
  .tab-dot{margin-top:0}
  .main-inner{padding:44px 48px 80px}
}
</style>
</head>
<body>
<div class="shell">
  <nav class="top-nav">
    <div class="brand-row">
      <span class="brand-cross">✦ ✝ ✦</span>
      <span class="brand-title" id="brandTitle">Liturgy of the Hours</span>
      <span class="brand-clock" id="clock"></span>
      <div class="lang-toggle">
        <button class="lang-btn active" id="btnEN" onclick="setLang('en')">EN</button>
        <button class="lang-btn" id="btnIT" onclick="setLang('it')">IT</button>
      </div>
      <button class="reset-btn" onclick="clearProgress()">RESET</button>
    </div>
    <div class="hour-scroll" id="hourNav"></div>
  </nav>
  <div class="main-scroll" id="mainScroll">
    <div class="main-inner" id="mainInner"></div>
  </div>
</div>

const DAY_MYSTERIES = ['glorious','joyful','sorrowful','luminous','sorrowful','luminous','glorious'];
const MYSTERY_ORDER = ['joyful','luminous','sorrowful','glorious'];

// ── STATE ─────────────────────────────────────────
let lang = localStorage.getItem('lang') || 'en';
let activeId = getCurrentId();
let silenceTimers = {};
let intention = '';

const TODAY_KEY = 'visited_' + new Date().toISOString().slice(0,10);
function loadVisited() { try { return new Set(JSON.parse(localStorage.getItem(TODAY_KEY)||'[]')); } catch(e) { return new Set(); } }
function saveVisited() { try { localStorage.setItem(TODAY_KEY, JSON.stringify([...visitedIds])); } catch(e) {} }
function clearProgress() { visitedIds = new Set(); try { localStorage.removeItem(TODAY_KEY); } catch(e) {} renderNav(); }
let visitedIds = loadVisited();

function getCurrentId() {
  const h = new Date().getHours();
  let result = (lang==='en'?HOURS_EN:HOURS_IT)[0];
  for (const hr of (lang==='en'?HOURS_EN:HOURS_IT)) { if (h>=hr.start) result=hr; }
  return result.id;
}

function setLang(l) {
  lang = l;
  localStorage.setItem('lang', l);
  document.getElementById('btnEN').classList.toggle('active', l==='en');
  document.getElementById('btnIT').classList.toggle('active', l==='it');
  document.getElementById('brandTitle').textContent = FIXED[lang].appTitle;
  renderNav();
  const content = activeId==='rosary' ? renderRosary() : renderHour(activeId);
  document.getElementById('mainInner').innerHTML = content;
}

// ── HELPERS ───────────────────────────────────────
function T() { return FIXED[lang]; }
function HOURS() { return lang==='en' ? HOURS_EN : HOURS_IT; }
function vc(lines) { return lines.map(l=>`<div class="versicle"><span class="v-mark">${l.v}</span><span>${l.t}</span></div>`).join(''); }
function ornament() { return '<div class="ornament">· · ·</div>'; }
function sectionLabel(text) { return `<div class="section-label">${text}</div>`; }

function silenceBlock(hourId) {
  const key=`silence-${hourId}`;
  return `<div class="silence-block" id="${key}">
    <span class="silence-label">${T().silence}</span>
    <span class="silence-timer" id="${key}-display">0:15</span>
    <button class="silence-btn" onclick="startSilence('${hourId}')">${T().silenceBegin}</button>
  </div>`;
}

function startSilence(hourId) {
  const key=`silence-${hourId}`;
  const display=document.getElementById(`${key}-display`);
  const btn=document.querySelector(`#${key} .silence-btn`);
  if (!display||!btn||silenceTimers[hourId]) return;
  btn.textContent='…'; btn.disabled=true;
  let secs=15;
  display.textContent=`0:${String(secs).padStart(2,'0')}`;
  silenceTimers[hourId]=setInterval(()=>{
    secs--;
    if (secs<=0) {
      clearInterval(silenceTimers[hourId]); delete silenceTimers[hourId];
      display.textContent='Amen'; btn.textContent=T().silenceDone; btn.disabled=false;
    } else { display.textContent=`0:${String(secs).padStart(2,'0')}`; }
  },1000);
}

// ── RENDER HOUR ───────────────────────────────────
function renderHour(id) {
  const h = HOURS().find(x=>x.id===id);
  if (!h) return '';
  const t = T();
  let s = `<div class="hour-header">
    <div class="hour-name-row">
      <span class="latin-name">${h.latin}</span>
      <span class="trans-name">${h.name}</span>
    </div>
    <div class="hour-desc">${h.desc}</div>
    <span class="duration-badge">${h.duration}</span>
  </div>`;

  s += `<div class="section">${sectionLabel(t.stillness)}${silenceBlock(h.id)}</div>${ornament()}`;

  s += `<div class="section">${sectionLabel(t.opening)}
    <div class="sign-of-cross">
      <span class="cross-symbol">✝</span>
      <span class="cross-words">${t.crossWords}</span>
    </div>
    <div class="versicle-block">${vc(h.opening)}</div>
  </div>${ornament()}`;

  if (h.hasIntention) {
    s += `<div class="section">${sectionLabel(t.intention)}
      <div class="intention-block">
        <input class="intention-input" type="text" placeholder="${t.intentionPlaceholder}" value="${intention}" oninput="intention=this.value"/>
      </div>
    </div>${ornament()}`;
  }

  s += `<div class="section">
    ${sectionLabel(t.psalm+'&nbsp;&nbsp;<span class="psalm-ref-inline">'+h.psalmRef+'</span>')}
    <div class="antiphon">${h.psalm.antiphon}</div>
    <div class="psalm-verses">${h.psalm.verses.map(v=>`<p>${v}</p>`).join('')}</div>
    <div class="antiphon bottom">${h.psalm.antiphon}</div>
  </div>${ornament()}`;

  s += `<div class="section">${sectionLabel(t.reading)}
    <div class="reading-ref">${h.reading.ref}</div>
    <div class="reading-text">${h.reading.text}</div>
  </div>${ornament()}`;

  s += `<div class="section">${sectionLabel(t.responsory)}
    <div class="versicle-block">${vc(h.responsory)}</div>
  </div>`;

  if (h.hasAngelus) {
    s += `${ornament()}<div class="section">${sectionLabel(t.angelusTitle)}
      <div class="angelus-block">${t.angelus.map(line=>{
        if(line.type==='verse') return `<div class="angelus-verse">${line.text}</div>`;
        if(line.type==='response') return `<div class="angelus-response">R. ${line.text}</div>`;
        return `<div class="angelus-ave">${line.text}</div>`;
      }).join('')}</div>
    </div>`;
  }

  if (h.canticle) {
    s += `${ornament()}<div class="section">${sectionLabel(t.canticle)}
      <div class="canticle-name">${h.canticle.name}</div>
      <div class="canticle-text">${h.canticle.verses.map(v=>`<p>${v}</p>`).join('')}</div>
    </div>`;
  }

  if (h.hasExamen) {
    s += `${ornament()}<div class="section">${sectionLabel(t.contritionTitle)}
      <div class="contrition-text">${t.contritionText}</div>
    </div>${ornament()}
    <div class="section">${sectionLabel(t.examenTitle)}
      <div class="examen-text">${t.examenText}</div>
    </div>`;
  }

  if (h.hasSalve) {
    s += `${ornament()}<div class="section">${sectionLabel(t.salveTitle)}
      <div class="salve-text">${t.salve}</div>
    </div>`;
  }

  s += `${ornament()}<div class="section">${sectionLabel(t.closing)}
    <div class="versicle-block">${vc([{v:'V.',t:t.bless},{v:'R.',t:t.thanks}])}</div>
    <div class="dismissal">${h.closing}</div>
  </div>`;

  return s;
}

// ── RENDER ROSARY ─────────────────────────────────
function renderRosary() {
  const t = T();
  const day = new Date().getDay();
  const todayKey = DAY_MYSTERIES[day];
  const today = t.mysteries[todayKey];

  let s = `<div class="hour-header">
    <div class="hour-name-row">
      <span class="latin-name">${t.rosaryName}</span>
      <span class="trans-name">${t.rosaryDevot}</span>
    </div>
    <div class="hour-desc">${t.rosaryDesc}</div>
    <span class="duration-badge">~20 min</span>
  </div>`;

  s += `<div class="section">${sectionLabel(t.todayLabel+' — '+t.dayNames[day])}
    <div style="padding:14px;border:1px solid var(--border);background:var(--gold-faint);margin-bottom:4px;">
      <div style="font-family:'Cinzel',serif;font-size:0.72rem;letter-spacing:0.15em;color:var(--gold);margin-bottom:4px;">${today.name.toUpperCase()}</div>
      <div style="font-size:0.88rem;color:var(--cream-faint);font-style:italic;">${today.days}</div>
    </div>
  </div>${ornament()}`;

  s += `<div class="section">${sectionLabel(t.rosaryOpening)}
    <div class="sign-of-cross"><span class="cross-symbol">✝</span><span class="cross-words">${t.crossWords}</span></div>
    <div style="margin-bottom:14px;"><div class="reading-ref">${t.creedTitle}</div><div class="salve-text">${t.creedText}</div></div>
    <div style="margin-bottom:14px;"><div class="reading-ref">${t.ourFatherTitle}</div><div class="salve-text">${t.ourFather}</div></div>
    <div style="margin-bottom:6px;"><div class="reading-ref">${t.hailMaryTitle} <span style="color:var(--cream-faint);font-style:italic;letter-spacing:0;">${t.hailMaryNote}</span></div><div class="salve-text">${t.hailMary}</div></div>
    <div><div class="reading-ref">${t.gloryBeTitle}</div><div class="salve-text">${t.gloryBe}</div></div>
  </div>${ornament()}`;

  s += `<div class="section">${sectionLabel(t.fiveDecades)}`;
  today.list.forEach(m=>{
    s += `<div style="margin-bottom:22px;padding:16px 18px;border:1px solid var(--border);border-left:2px solid var(--gold);">
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:6px;">
        <span style="font-family:'Cinzel',serif;font-size:0.62rem;letter-spacing:0.18em;color:var(--gold);">${m.n}.</span>
        <span style="font-family:'Cinzel',serif;font-size:0.75rem;letter-spacing:0.1em;color:var(--gold-dim);">${m.title.toUpperCase()}</span>
      </div>
      <div style="font-size:0.85rem;color:rgba(200,168,74,0.45);font-style:italic;font-family:'Cinzel',serif;letter-spacing:0.08em;margin-bottom:8px;">${t.fruitLabel} ${m.fruit}</div>
      <div style="font-size:0.95rem;color:var(--cream-faint);font-style:italic;margin-bottom:12px;line-height:1.7;">${m.text}</div>
      <div style="font-size:0.8rem;color:var(--cream-faint);line-height:1.6;"><span style="color:var(--gold-dim);">${t.decadeSeq}</span></div>
    </div>`;
  });
  s += `</div>`;

  s += `${ornament()}<div class="section">${sectionLabel(t.decadePrayers)}
    <div style="margin-bottom:16px;"><div class="reading-ref">${t.fatimaTitle} <span style="color:var(--cream-faint);font-style:italic;letter-spacing:0;">${t.fatimaNote}</span></div><div class="salve-text">${t.fatima}</div></div>
    <div style="margin-bottom:16px;"><div class="reading-ref">${t.hailMaryTitle}</div><div class="salve-text">${t.hailMary}</div></div>
    <div><div class="reading-ref">${t.gloryBeTitle}</div><div class="salve-text">${t.gloryBe}</div></div>
  </div>${ornament()}`;

  s += `<div class="section">${sectionLabel(t.closing)}
    <div style="margin-bottom:16px;"><div class="reading-ref">${t.salveClose}</div><div class="salve-text">${t.salve}</div></div>
    <div style="margin-bottom:16px;"><div class="versicle-block">
      <div class="versicle"><span class="v-mark">V.</span><span style="font-style:italic;">${t.prayForUs}</span></div>
      <div class="versicle"><span class="v-mark">R.</span><span style="font-style:italic;">${t.worthyOf}</span></div>
    </div></div>
  </div>${ornament()}`;

  s += `<div class="section">${sectionLabel(t.allMysteries)}`;
  MYSTERY_ORDER.forEach(key=>{
    const m=t.mysteries[key]; const isToday=key===todayKey;
    s += `<div style="margin-bottom:16px;">
      <div style="font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.16em;color:${isToday?'var(--gold)':'var(--gold-dim)'};margin-bottom:4px;">${m.name.toUpperCase()}${isToday?' ✦':''}</div>
      <div style="font-size:0.82rem;color:var(--cream-faint);font-style:italic;margin-bottom:6px;">${m.days}</div>
      ${m.list.map(my=>`<div style="display:flex;gap:10px;margin-bottom:3px;font-size:0.9rem;color:var(--cream-dim);"><span style="color:var(--gold-dim);flex-shrink:0;">${my.n}.</span><span>${my.title}</span></div>`).join('')}
    </div>`;
  });
  s += `</div>`;
  return s;
}

// ── RENDER NAV ────────────────────────────────────
function renderNav() {
  const curId = getCurrentId();
  const hourTabs = HOURS().map(h=>`
    <button class="hour-tab ${h.id===activeId?'active':''} ${visitedIds.has(h.id)?'visited':''}" onclick="show('${h.id}')">
      ${h.id===activeId?'<span style="position:absolute;bottom:0;left:4px;right:4px;height:2px;background:var(--gold);border-radius:2px 2px 0 0"></span>':''}
      <span class="tab-latin">${h.latin.toUpperCase()}</span>
      <span class="tab-time">${h.timeLabel}</span>
      ${h.id===curId?'<span class="tab-dot"></span>':''}
      <span class="tab-check">✓</span>
    </button>`).join('');

  const rosaryTab = `
    <button class="hour-tab ${activeId==='rosary'?'active':''} ${visitedIds.has('rosary')?'visited':''}" onclick="show('rosary')" style="border-left:1px solid var(--border);">
      ${activeId==='rosary'?'<span style="position:absolute;bottom:0;left:4px;right:4px;height:2px;background:var(--gold);border-radius:2px 2px 0 0"></span>':''}
      <span class="tab-latin">${T().rosaryName.toUpperCase()}</span>
      <span class="tab-time">✦</span>
      <span class="tab-check">✓</span>
    </button>`;

  document.getElementById('hourNav').innerHTML = hourTabs + rosaryTab;
}

// ── SHOW ──────────────────────────────────────────
function show(id) {
  activeId=id; visitedIds.add(id); saveVisited();
  renderNav();
  document.getElementById('mainInner').innerHTML = id==='rosary' ? renderRosary() : renderHour(id);
  document.getElementById('mainScroll').scrollTo({top:0,behavior:'smooth'});
  document.querySelector('.hour-tab.active')?.scrollIntoView({inline:'center',behavior:'smooth'});
}

// ── CLOCK ─────────────────────────────────────────
function tick() {
  const el=document.getElementById('clock');
  if(el) el.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

// ── INIT ──────────────────────────────────────────
document.getElementById('brandTitle').textContent = FIXED[lang].appTitle;
document.getElementById('btnEN').classList.toggle('active', lang==='en');
document.getElementById('btnIT').classList.toggle('active', lang==='it');
show(getCurrentId());
tick();
setInterval(tick,30000);
</script>
</body>
</html>
